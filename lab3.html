<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Лабораторная 3. Управление задачами с помощью JavaScript ES6 и DOM."><title>Планировщик — лабораторная 3</title>
<style>:root{font-family:system-ui,sans-serif;color:#17211d;background:#f4f7f5;--green:#176b53}*{box-sizing:border-box}body{margin:0;line-height:1.5}header,footer{background:#123f34;color:#fff;padding:1rem max(1rem,calc((100% - 1000px)/2))}header nav{display:flex;gap:1rem}a{color:#176b53}header a,footer a{color:white}main{max-width:1000px;margin:2rem auto;padding:0 1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.card{background:white;border:1px solid #d7e2dc;border-radius:16px;padding:1.25rem}form{display:grid;gap:.75rem}label{font-weight:600}input,select,button{font:inherit;padding:.7rem;border:1px solid #aebfb5;border-radius:9px}button{background:var(--green);color:#fff;border:0;cursor:pointer;font-weight:700}button:focus-visible,input:focus,select:focus,a:focus-visible{outline:3px solid #e7ae4b;outline-offset:2px}.item{display:flex;gap:.75rem;align-items:center;border-bottom:1px solid #e5ece8;padding:.75rem 0}.item.done .name{text-decoration:line-through;color:#637168}.item .name{flex:1}.delete{background:#9c3434;padding:.4rem .65rem}.status{min-height:1.5em;color:#176b53}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>Мой планировщик</h1><p>Лабораторная 3 · Интерактивность на JavaScript ES6+</p><nav aria-label="Лабораторные"><a href="lab2.html">← Лаб. 2</a><a href="lab3.html" aria-current="page">Лаб. 3</a><a href="lab4.html">Лаб. 4 →</a></nav></header><main><div class="grid"><section class="card"><h2>Новая задача</h2><form id="task-form"><label for="title">Название задачи</label><input id="title" name="title" required minlength="2" maxlength="80" placeholder="Что нужно сделать?"><label for="date">Срок</label><input id="date" name="date" type="date" required><label for="priority">Приоритет</label><select id="priority" name="priority"><option value="Обычный">Обычный</option><option value="Высокий">Высокий</option><option value="Низкий">Низкий</option></select><button>Добавить задачу</button></form><p id="status" class="status" role="status" aria-live="polite"></p></section><section class="card"><h2>Список задач <span id="count"></span></h2><ul id="tasks" style="list-style:none;padding:0;margin:0"></ul></section></div></main><footer><p>Данные сохраняются в этом браузере.</p></footer>
<script type="module">
const STORAGE_KEY = 'planner-lab3-tasks';
const initialTasks = [
  { id: crypto.randomUUID(), title: 'Подготовить план недели', date: '2026-11-02', priority: 'Высокий', done: false },
  { id: crypto.randomUUID(), title: 'Прочитать главу курса', date: '2026-11-04', priority: 'Обычный', done: false },
];
const loadTasks = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? initialTasks; } catch { return initialTasks; } };
let tasks = loadTasks();
const list = document.querySelector('#tasks');
const count = document.querySelector('#count');
const status = document.querySelector('#status');
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
const render = () => {
  list.replaceChildren();
  count.textContent = `(${tasks.filter(({ done }) => !done).length} активных)`;
  for (const task of tasks) {
    const row = document.createElement('li'); row.className = `item${task.done ? ' done' : ''}`;
    const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.done; checkbox.setAttribute('aria-label', `Отметить «${task.title}» выполненной`);
    checkbox.addEventListener('change', () => { tasks = tasks.map((item) => item.id === task.id ? { ...item, done: checkbox.checked } : item); save(); render(); });
    const name = document.createElement('span'); name.className = 'name'; name.textContent = `${task.title} · ${task.date} · ${task.priority}`;
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'delete'; remove.textContent = 'Удалить'; remove.setAttribute('aria-label', `Удалить «${task.title}»`);
    remove.addEventListener('click', () => { tasks = tasks.filter((item) => item.id !== task.id); save(); render(); status.textContent = 'Задача удалена.'; });
    row.append(checkbox, name, remove); list.append(row);
  }
};
document.querySelector('#task-form').addEventListener('submit', (event) => {
  event.preventDefault(); const data = new FormData(event.currentTarget);
  tasks = [{ id: crypto.randomUUID(), title: data.get('title').trim(), date: data.get('date'), priority: data.get('priority'), done: false }, ...tasks];
  save(); render(); event.currentTarget.reset(); status.textContent = 'Задача добавлена.'; document.querySelector('#title').focus();
});
render();
</script></body></html>
