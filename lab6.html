<body><header><h1>Мой планировщик</h1><p>Лабораторная 6 · Маршрутизация и обратная связь</p><nav aria-label="Лабораторные"><a href="lab5.html">← Лаб. 5</a><a href="lab6.html" aria-current="page">Лаб. 6</a></nav></header><main id="root"><p>Загружаем приложение… Для корректной работы откройте через локальный веб-сервер.</p></main><footer><p>Итоговый проект · Лабораторная 6 из 6</p></footer>
