<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Лабораторная 5. Планировщик на React с компонентами, состоянием и Context."><title>Планировщик — лабораторная 5</title><style>:root{font-family:system-ui,sans-serif;color:#17211d;background:#f4f7f5;--green:#176b53}*{box-sizing:border-box}body{margin:0;line-height:1.5}header,footer{background:#123f34;color:white;padding:1rem max(1rem,calc((100% - 1000px)/2))}header nav{display:flex;gap:1rem}header a,footer a{color:white}main{max-width:1000px;margin:2rem auto;padding:0 1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.card{background:white;border:1px solid #d7e2dc;border-radius:16px;padding:1.25rem}form{display:grid;gap:.75rem}input,select,button{font:inherit;padding:.7rem;border:1px solid #aebfb5;border-radius:9px}button{background:var(--green);color:white;border:0;cursor:pointer;font-weight:700}button:focus-visible,input:focus,a:focus-visible{outline:3px solid #e7ae4b;outline-offset:2px}.item{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-bottom:1px solid #e5ece8}.item span{flex:1}.done{text-decoration:line-through;color:#647168}.notice{color:#176b53;min-height:1.5em}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>Мой планировщик</h1><p>Лабораторная 5 · React-компоненты, состояние и Context</p><nav aria-label="Лабораторные"><a href="lab4.html">← Лаб. 4</a><a href="lab5.html" aria-current="page">Лаб. 5</a><a href="lab6.html">Лаб. 6 →</a></nav></header><main id="root"><p>Загружаем приложение… Для запуска используйте локальный веб-сервер.</p></main><footer><p>Лабораторная 5 из 6 · React</p></footer>
<script type="module">
import React, { createContext, useContext, useMemo, useState } from 'https://esm.sh/react@19';
import { createRoot } from 'https://esm.sh/react-dom@19/client';

  const [notice, setNotice] = useState('');

  function submit(event) { event.preventDefault(); add({ title: title.trim(), date, priority }); setTitle(''); setDate(''); setPriority('Обычный'); }
  return h('section', { className: 'card' }, h('h2', null, 'Новая задача'), h('form', { onSubmit: submit }, h('label', { htmlFor: 'title' }, 'Название'), h('input', { id: 'title', value: title, onChange: (e) => setTitle(e.target.value), required: true, minLength: 2, maxLength: 80 }), h('label', { htmlFor: 'date' }, 'Срок'), h('input', { id: 'date', type: 'date', value: date, onChange: (e) => setDate(e.target.value), required: true }), h('label', { htmlFor: 'priority' }, 'Приоритет'), h('select', { id: 'priority', value: priority, onChange: (e) => setPriority(e.target.value) }, ...['Обычный', 'Высокий', 'Низкий'].map((v) => h('option', { key: v }, v))), h('button', null, 'Добавить')), h('p', { className: 'notice', role: 'status', 'aria-live': 'polite' }, useContext(TaskContext).notice));

</script></body></html>
